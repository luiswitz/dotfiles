window:
  decorations: "None"
  dynamic_padding: true
  startup_mode: "Maximized"

colors:
  draw_bold_text_with_bright_colors: true

cursor:
  blink_interval: 600
  style:
    blinking: "Always"
    shape: "Block"

font:
  size: 13.5
  normal:
    family: "Source Code Pro"
    style: "Medium"

  bold:
    family: "Source Code Pro"
    style: "Bold"

  italic:
    family: "Source Code Pro"
    style: "Italic"

scrolling:
  history: 10000
