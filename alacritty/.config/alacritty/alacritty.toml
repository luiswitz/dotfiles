[general]
import = ["~/.config/alacritty/themes/themes/kanagawa_wave.toml"]

[colors]
draw_bold_text_with_bright_colors = true

[cursor]
blink_interval = 600

[cursor.style]
blinking = "Always"
shape = "Block"

[font]
size = 16.5

[font.bold]
family = "SauceCodePro Nerd Font"
style = "Bold"

[font.bold_italic]
family = "SauceCodePro Nerd Font"
style = "Bold Italic"

[font.italic]
family = "SauceCodePro Nerd Font"
style = "Italic"

[font.normal]
family = "SauceCodePro Nerd Font"
style = "Regular"

[[keyboard.bindings]]
chars = "\u001E"
key = "Key6"
mods = "Control"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key9"
mods = "Command"

[scrolling]
history = 10000

[terminal.shell]
program = "/bin/zsh"

[window]
decorations = "None"
dynamic_padding = true
startup_mode = "Maximized"
