## COLORSCHEME: gruvbox dark

# Backgrounds
set -g @gruvbox_bg_dim '#1D2021'
set -g @gruvbox_bg0 '#282828'
set -g @gruvbox_bg1 '#3C3836'
set -g @gruvbox_bg2 '#504945'
set -g @gruvbox_bg3 '#665C54'
set -g @gruvbox_bg4 '#7C6F64'
set -g @gruvbox_bg_visual '#504945'
set -g @gruvbox_bg_red '#CC241D'
set -g @gruvbox_bg_green '#98971A'
set -g @gruvbox_bg_blue '#458588'
set -g @gruvbox_bg_yellow '#D79921'

# Foregrounds
set -g @gruvbox_fg '#EBDBB2'
set -g @gruvbox_red '#FB4934'
set -g @gruvbox_orange '#FE8019'
set -g @gruvbox_yellow '#FABD2F'
set -g @gruvbox_green '#B8BB26'
set -g @gruvbox_aqua '#8EC07C'
set -g @gruvbox_blue '#83A598'
set -g @gruvbox_purple '#D3869B'
set -g @gruvbox_grey0 '#928374'
set -g @gruvbox_grey1 '#A89984'
set -g @gruvbox_grey2 '#BDAE93'
set -g @gruvbox_statusline1 '#B8BB26'
set -g @gruvbox_statusline2 '#EBDBB2'
set -g @gruvbox_statusline3 '#FB4934'

# Status bar
set-option -g status "on"
set -g status-interval 2
set-option -g status-fg '#EBDBB2'
set-option -g status-bg '#282828'
set-option -g mode-style fg='#{@gruvbox_purple}',bg='#{@gruvbox_bg_red}'
set-option -g status-style fg='#{@gruvbox_fg}',bg='#{@gruvbox_bg_dim}',default

# Windows
set-window-option -g window-status-style fg='#{@gruvbox_bg4}',bg='#{@gruvbox_bg0}'
set-window-option -g window-status-activity-style 'bg=#{@gruvbox_bg1},fg=#{@gruvbox_bg3}'
set-window-option -g window-status-current-style fg='#{@gruvbox_fg}',bg='#{@gruvbox_bg_green}'

# Panes
set-option -g pane-border-style fg='#{@gruvbox_bg1}'
set-option -g pane-active-border-style 'fg=#{@gruvbox_blue}'
set-option -g display-panes-active-colour '#83A598'
set-option -g display-panes-colour '#FE8019'

# Command messages
set-option -g message-style fg='#{@gruvbox_statusline3}',bg='#{@gruvbox_bg_dim}'
set-option -g message-command-style 'fg=#{@gruvbox_bg3},bg=#{@gruvbox_bg1}'

# Clock
set-window-option -g clock-mode-colour '#83A598'

# Bell
set-window-option -g window-status-bell-style fg='#{@gruvbox_bg0}',bg='#{@gruvbox_statusline3}'

# Formatting
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#{@gruvbox_bg_dim},bg=#{@gruvbox_green},bold] #S #[fg=#{@gruvbox_green},bg=#{@gruvbox_bg2},nobold]#[fg=#{@gruvbox_green},bg=#{@gruvbox_bg2},bold] #(whoami) #[fg=#{@gruvbox_bg2},bg=#{@gruvbox_bg0},nobold]'

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#{@gruvbox_bg2}]#[fg=#{@gruvbox_fg},bg=#{@gruvbox_bg2}] #[fg=#{@gruvbox_fg},bg=#{@gruvbox_bg2}]%Y-%m-%d  %H:%M #[fg=#{@gruvbox_aqua},bg=#{@gruvbox_bg2},bold]#[fg=#{@gruvbox_bg_dim},bg=#{@gruvbox_aqua},bold] #h '

set -g window-status-separator '#[fg=#{@gruvbox_grey2},bg=#{@gruvbox_bg0}] '
set -g window-status-format "#[fg=#{@gruvbox_grey0},bg=#{@gruvbox_bg0}] #I  #[fg=#{@gruvbox_grey0},bg=#{@gruvbox_bg0}]#W "
set -g window-status-current-format "#[fg=#{@gruvbox_bg0},bg=#{@gruvbox_bg_green}]#[fg=#{@gruvbox_fg},bg=#{@gruvbox_bg_green}] #I  #[fg=#{@gruvbox_fg},bg=#{@gruvbox_bg_green},bold]#W #[fg=#{@gruvbox_bg_green},bg=#{@gruvbox_bg0},nobold]"

