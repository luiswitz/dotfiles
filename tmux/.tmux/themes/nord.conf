## COLORSCHEME: nord

# Backgrounds
set -g @nord_bg_dim '#2E3440'
set -g @nord_bg0 '#3B4252'
set -g @nord_bg1 '#434C5E'
set -g @nord_bg2 '#4C566A'
set -g @nord_bg3 '#616E88'
set -g @nord_bg4 '#65737E'
set -g @nord_bg_visual '#434C5E'
set -g @nord_bg_red '#BF616A'
set -g @nord_bg_green '#A3BE8C'
set -g @nord_bg_blue '#5E81AC'
set -g @nord_bg_yellow '#EBCB8B'

# Foregrounds
set -g @nord_fg '#D8DEE9'
set -g @nord_red '#BF616A'
set -g @nord_orange '#D08770'
set -g @nord_yellow '#EBCB8B'
set -g @nord_green '#A3BE8C'
set -g @nord_aqua '#88C0D0'
set -g @nord_blue '#5E81AC'
set -g @nord_purple '#B48EAD'
set -g @nord_grey0 '#81A1C1'
set -g @nord_grey1 '#4C566A'
set -g @nord_grey2 '#3B4252'
set -g @nord_statusline1 '#A3BE8C'
set -g @nord_statusline2 '#D8DEE9'
set -g @nord_statusline3 '#BF616A'

# Status bar
set-option -g status "on"
set -g status-interval 2
set-option -g status-fg '#D8DEE9'
set-option -g status-bg '#3B4252'
set-option -g mode-style fg='#{@nord_purple}',bg='#{@nord_bg_red}'
set-option -g status-style fg='#{@nord_fg}',bg='#{@nord_bg_dim}',default

# Windows
set-window-option -g window-status-style fg='#{@nord_bg4}',bg='#{@nord_bg0}'
set-window-option -g window-status-activity-style 'bg=#{@nord_bg1},fg=#{@nord_bg3}'
set-window-option -g window-status-current-style fg='#{@nord_fg}',bg='#{@nord_bg_green}'

# Panes
set-option -g pane-border-style fg='#{@nord_bg1}'
set-option -g pane-active-border-style 'fg=#{@nord_blue}'
set-option -g display-panes-active-colour '#5E81AC'
set-option -g display-panes-colour '#D08770'

# Command messages
set-option -g message-style fg='#{@nord_statusline3}',bg='#{@nord_bg_dim}'
set-option -g message-command-style 'fg=#{@nord_bg3},bg=#{@nord_bg1}'

# Clock
set-window-option -g clock-mode-colour '#5E81AC'

# Bell
set-window-option -g window-status-bell-style fg='#{@nord_bg0}',bg='#{@nord_statusline3}'

# Formatting
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#{@nord_bg_dim},bg=#{@nord_green},bold] #S #[fg=#{@nord_green},bg=#{@nord_bg2},nobold]#[fg=#{@nord_green},bg=#{@nord_bg2},bold] #(whoami) #[fg=#{@nord_bg2},bg=#{@nord_bg0},nobold]'

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#{@nord_bg2}]#[fg=#{@nord_fg},bg=#{@nord_bg2}] #[fg=#{@nord_fg},bg=#{@nord_bg2}]%Y-%m-%d  %H:%M #[fg=#{@nord_aqua},bg=#{@nord_bg2},bold]#[fg=#{@nord_bg_dim},bg=#{@nord_aqua},bold] #h '

set -g window-status-separator '#[fg=#{@nord_grey2},bg=#{@nord_bg0}] '
set -g window-status-format "#[fg=#{@nord_grey0},bg=#{@nord_bg0}] #I  #[fg=#{@nord_grey0},bg=#{@nord_bg0}]#W "
set -g window-status-current-format "#[fg=#{@nord_bg0},bg=#{@nord_bg_green}]#[fg=#{@nord_fg},bg=#{@nord_bg_green}] #I  #[fg=#{@nord_fg},bg=#{@nord_bg_green},bold]#W #[fg=#{@nord_bg_green},bg=#{@nord_bg0},nobold]"
