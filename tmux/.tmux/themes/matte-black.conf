## COLORSCHEME: matte-black

# Backgrounds
set -g @matte_bg_dim '#0D0D0D'
set -g @matte_bg0 '#141414'
set -g @matte_bg1 '#1A1A1A'
set -g @matte_bg2 '#1F1F1F'
set -g @matte_bg3 '#262626'
set -g @matte_bg4 '#2D2D2D'
set -g @matte_bg_visual '#1C1C1C'
set -g @matte_bg_red '#FF4C4C'
set -g @matte_bg_green '#4CFF4C'
set -g @matte_bg_blue '#4C4CFF'
set -g @matte_bg_yellow '#FFFF4C'

# Foregrounds
set -g @matte_fg '#E5E5E5'
set -g @matte_red '#FF4C4C'
set -g @matte_orange '#FF944C'
set -g @matte_yellow '#FFFF4C'
set -g @matte_green '#4CFF4C'
set -g @matte_aqua '#4CFFFF'
set -g @matte_blue '#4C4CFF'
set -g @matte_purple '#B84CFF'
set -g @matte_grey0 '#7F7F7F'
set -g @matte_grey1 '#9F9F9F'
set -g @matte_grey2 '#BFBFBF'
set -g @matte_statusline1 '#4CFF4C'
set -g @matte_statusline2 '#E5E5E5'
set -g @matte_statusline3 '#FF4C4C'

# Status bar
set-option -g status "on"
set -g status-interval 2
set-option -g status-fg '#E5E5E5'
set-option -g status-bg '#141414'
set-option -g mode-style fg='#{@matte_purple}',bg='#{@matte_bg_red}'
set-option -g status-style fg='#{@matte_fg}',bg='#{@matte_bg_dim}',default

# Windows
set-window-option -g window-status-style fg='#{@matte_bg4}',bg='#{@matte_bg0}'
set-window-option -g window-status-activity-style 'bg=#{@matte_bg1},fg=#{@matte_bg3}'
set-window-option -g window-status-current-style fg='#{@matte_fg}',bg='#{@matte_bg_green}'

# Panes
set-option -g pane-border-style fg='#{@matte_bg1}'
set-option -g pane-active-border-style 'fg=#{@matte_blue}'
set-option -g display-panes-active-colour '#4C4CFF'
set-option -g display-panes-colour '#FF944C'

# Command messages
set-option -g message-style fg='#{@matte_statusline3}',bg='#{@matte_bg_dim}'
set-option -g message-command-style 'fg=#{@matte_bg3},bg=#{@matte_bg1}'

# Clock
set-window-option -g clock-mode-colour '#4C4CFF'

# Bell
set-window-option -g window-status-bell-style fg='#{@matte_bg0}',bg='#{@matte_statusline3}'

# Formatting
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#{@matte_bg_dim},bg=#{@matte_green},bold] #S #[fg=#{@matte_green},bg=#{@matte_bg2},nobold]#[fg=#{@matte_green},bg=#{@matte_bg2},bold] #(whoami) #[fg=#{@matte_bg2},bg=#{@matte_bg0},nobold]'

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#{@matte_bg2}]#[fg=#{@matte_fg},bg=#{@matte_bg2}] #[fg=#{@matte_fg},bg=#{@matte_bg2}]%Y-%m-%d  %H:%M #[fg=#{@matte_aqua},bg=#{@matte_bg2},bold]#[fg=#{@matte_bg_dim},bg=#{@matte_aqua},bold] #h '

set -g window-status-separator '#[fg=#{@matte_grey2},bg=#{@matte_bg0}] '
set -g window-status-format "#[fg=#{@matte_grey0},bg=#{@matte_bg0}] #I  #[fg=#{@matte_grey0},bg=#{@matte_bg0}]#W "
set -g window-status-current-format "#[fg=#{@matte_bg0},bg=#{@matte_bg_green}]#[fg=#{@matte_fg},bg=#{@matte_bg_green}] #I  #[fg=#{@matte_fg},bg=#{@matte_bg_green},bold]#W #[fg=#{@matte_bg_green},bg=#{@matte_bg0},nobold]"
