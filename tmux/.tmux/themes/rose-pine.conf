## COLORSCHEME: rose-pine

# Backgrounds
set -g @rosepine_bg_dim '#191724'
set -g @rosepine_bg0 '#1F1D2E'
set -g @rosepine_bg1 '#26233A'
set -g @rosepine_bg2 '#2A283E'
set -g @rosepine_bg3 '#332E4A'
set -g @rosepine_bg4 '#3C345F'
set -g @rosepine_bg_visual '#292438'
set -g @rosepine_bg_red '#EB6F92'
set -g @rosepine_bg_green '#9CCFBC'
set -g @rosepine_bg_blue '#31748F'
set -g @rosepine_bg_yellow '#F6C177'

# Foregrounds
set -g @rosepine_fg '#E0DEF4'
set -g @rosepine_red '#EB6F92'
set -g @rosepine_orange '#F6C177'
set -g @rosepine_yellow '#F6C177'
set -g @rosepine_green '#9CCFBC'
set -g @rosepine_aqua '#31748F'
set -g @rosepine_blue '#31748F'
set -g @rosepine_purple '#9A70A4'
set -g @rosepine_grey0 '#6E6A86'
set -g @rosepine_grey1 '#857E9E'
set -g @rosepine_grey2 '#A3A0C7'
set -g @rosepine_statusline1 '#9CCFBC'
set -g @rosepine_statusline2 '#E0DEF4'
set -g @rosepine_statusline3 '#EB6F92'

# Status bar
set-option -g status "on"
set -g status-interval 2
set-option -g status-fg '#E0DEF4'
set-option -g status-bg '#1F1D2E'
set-option -g mode-style fg='#{@rosepine_purple}',bg='#{@rosepine_bg_red}'
set-option -g status-style fg='#{@rosepine_fg}',bg='#{@rosepine_bg_dim}',default

# Windows
set-window-option -g window-status-style fg='#{@rosepine_bg4}',bg='#{@rosepine_bg0}'
set-window-option -g window-status-activity-style 'bg=#{@rosepine_bg1},fg=#{@rosepine_bg3}'
set-window-option -g window-status-current-style fg='#{@rosepine_fg}',bg='#{@rosepine_bg_green}'

# Panes
set-option -g pane-border-style fg='#{@rosepine_bg1}'
set-option -g pane-active-border-style 'fg=#{@rosepine_blue}'
set-option -g display-panes-active-colour '#31748F'
set-option -g display-panes-colour '#F6C177'

# Command messages
set-option -g message-style fg='#{@rosepine_statusline3}',bg='#{@rosepine_bg_dim}'
set-option -g message-command-style 'fg=#{@rosepine_bg3},bg=#{@rosepine_bg1}'

# Clock
set-window-option -g clock-mode-colour '#31748F'

# Bell
set-window-option -g window-status-bell-style fg='#{@rosepine_bg0}',bg='#{@rosepine_statusline3}'

# Formatting
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#{@rosepine_bg_dim},bg=#{@rosepine_green},bold] #S #[fg=#{@rosepine_green},bg=#{@rosepine_bg2},nobold]#[fg=#{@rosepine_green},bg=#{@rosepine_bg2},bold] #(whoami) #[fg=#{@rosepine_bg2},bg=#{@rosepine_bg0},nobold]'

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#{@rosepine_bg2}]#[fg=#{@rosepine_fg},bg=#{@rosepine_bg2}] #[fg=#{@rosepine_fg},bg=#{@rosepine_bg2}]%Y-%m-%d  %H:%M #[fg=#{@rosepine_aqua},bg=#{@rosepine_bg2},bold]#[fg=#{@rosepine_bg_dim},bg=#{@rosepine_aqua},bold] #h '

set -g window-status-separator '#[fg=#{@rosepine_grey2},bg=#{@rosepine_bg0}] '
set -g window-status-format "#[fg=#{@rosepine_grey0},bg=#{@rosepine_bg0}] #I  #[fg=#{@rosepine_grey0},bg=#{@rosepine_bg0}]#W "
set -g window-status-current-format "#[fg=#{@rosepine_bg0},bg=#{@rosepine_bg_green}]#[fg=#{@rosepine_fg},bg=#{@rosepine_bg_green}] #I  #[fg=#{@rosepine_fg},bg=#{@rosepine_bg_green},bold]#W #[fg=#{@rosepine_bg_green},bg=#{@rosepine_bg0},nobold]"
