## COLORSCHEME: ristretto

# Backgrounds
set -g @ristretto_bg_dim '#1C1B19'
set -g @ristretto_bg0 '#26221D'
set -g @ristretto_bg1 '#2E2A23'
set -g @ristretto_bg2 '#38342C'
set -g @ristretto_bg3 '#413D35'
set -g @ristretto_bg4 '#4B453D'
set -g @ristretto_bg_visual '#3B362E'
set -g @ristretto_bg_red '#C85A5A'
set -g @ristretto_bg_green '#88B070'
set -g @ristretto_bg_blue '#5A9CBD'
set -g @ristretto_bg_yellow '#D8A657'

# Foregrounds
set -g @ristretto_fg '#E3DCC9'
set -g @ristretto_red '#C85A5A'
set -g @ristretto_orange '#D9996A'
set -g @ristretto_yellow '#D8A657'
set -g @ristretto_green '#88B070'
set -g @ristretto_aqua '#6CA0A3'
set -g @ristretto_blue '#5A9CBD'
set -g @ristretto_purple '#A67FAD'
set -g @ristretto_grey0 '#7E7A6D'
set -g @ristretto_grey1 '#9C988A'
set -g @ristretto_grey2 '#B7B1A3'
set -g @ristretto_statusline1 '#88B070'
set -g @ristretto_statusline2 '#E3DCC9'
set -g @ristretto_statusline3 '#C85A5A'

# Status bar
set-option -g status "on"
set -g status-interval 2
set-option -g status-fg '#E3DCC9'
set-option -g status-bg '#26221D'
set-option -g mode-style fg='#{@ristretto_purple}',bg='#{@ristretto_bg_red}'
set-option -g status-style fg='#{@ristretto_fg}',bg='#{@ristretto_bg_dim}',default

# Windows
set-window-option -g window-status-style fg='#{@ristretto_bg4}',bg='#{@ristretto_bg0}'
set-window-option -g window-status-activity-style 'bg=#{@ristretto_bg1},fg=#{@ristretto_bg3}'
set-window-option -g window-status-current-style fg='#{@ristretto_fg}',bg='#{@ristretto_bg_green}'

# Panes
set-option -g pane-border-style fg='#{@ristretto_bg1}'
set-option -g pane-active-border-style 'fg=#{@ristretto_blue}'
set-option -g display-panes-active-colour '#5A9CBD'
set-option -g display-panes-colour '#D9996A'

# Command messages
set-option -g message-style fg='#{@ristretto_statusline3}',bg='#{@ristretto_bg_dim}'
set-option -g message-command-style 'fg=#{@ristretto_bg3},bg=#{@ristretto_bg1}'

# Clock
set-window-option -g clock-mode-colour '#5A9CBD'

# Bell
set-window-option -g window-status-bell-style fg='#{@ristretto_bg0}',bg='#{@ristretto_statusline3}'

# Formatting
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#{@ristretto_bg_dim},bg=#{@ristretto_green},bold] #S #[fg=#{@ristretto_green},bg=#{@ristretto_bg2},nobold]#[fg=#{@ristretto_green},bg=#{@ristretto_bg2},bold] #(whoami) #[fg=#{@ristretto_bg2},bg=#{@ristretto_bg0},nobold]'

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#{@ristretto_bg2}]#[fg=#{@ristretto_fg},bg=#{@ristretto_bg2}] #[fg=#{@ristretto_fg},bg=#{@ristretto_bg2}]%Y-%m-%d  %H:%M #[fg=#{@ristretto_aqua},bg=#{@ristretto_bg2},bold]#[fg=#{@ristretto_bg_dim},bg=#{@ristretto_aqua},bold] #h '

set -g window-status-separator '#[fg=#{@ristretto_grey2},bg=#{@ristretto_bg0}] '
set -g window-status-format "#[fg=#{@ristretto_grey0},bg=#{@ristretto_bg0}] #I  #[fg=#{@ristretto_grey0},bg=#{@ristretto_bg0}]#W "
set -g window-status-current-format "#[fg=#{@ristretto_bg0},bg=#{@ristretto_bg_green}]#[fg=#{@ristretto_fg},bg=#{@ristretto_bg_green}] #I  #[fg=#{@ristretto_fg},bg=#{@ristretto_bg_green},bold]#W #[fg=#{@ristretto_bg_green},bg=#{@ristretto_bg0},nobold]"
