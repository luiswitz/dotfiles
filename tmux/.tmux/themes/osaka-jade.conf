## COLORSCHEME: osaka-jade

# Backgrounds
set -g @osaka_bg_dim '#1B1D1E'
set -g @osaka_bg0 '#242727'
set -g @osaka_bg1 '#2D3031'
set -g @osaka_bg2 '#373A3B'
set -g @osaka_bg3 '#414445'
set -g @osaka_bg4 '#4B4F50'
set -g @osaka_bg_visual '#363A3B'
set -g @osaka_bg_red '#C94F4F'
set -g @osaka_bg_green '#5FAF5F'
set -g @osaka_bg_blue '#4A90D9'
set -g @osaka_bg_yellow '#D9A65F'

# Foregrounds
set -g @osaka_fg '#D9D9D9'
set -g @osaka_red '#C94F4F'
set -g @osaka_orange '#D9865F'
set -g @osaka_yellow '#D9A65F'
set -g @osaka_green '#5FAF5F'
set -g @osaka_aqua '#5FAFAF'
set -g @osaka_blue '#4A90D9'
set -g @osaka_purple '#AF5FAF'
set -g @osaka_grey0 '#7F7F7F'
set -g @osaka_grey1 '#9F9F9F'
set -g @osaka_grey2 '#BFBFBF'
set -g @osaka_statusline1 '#5FAF5F'
set -g @osaka_statusline2 '#D9D9D9'
set -g @osaka_statusline3 '#C94F4F'

# Status bar
set-option -g status "on"
set -g status-interval 2
set-option -g status-fg '#D9D9D9'
set-option -g status-bg '#242727'
set-option -g mode-style fg='#{@osaka_purple}',bg='#{@osaka_bg_red}'
set-option -g status-style fg='#{@osaka_fg}',bg='#{@osaka_bg_dim}',default

# Windows
set-window-option -g window-status-style fg='#{@osaka_bg4}',bg='#{@osaka_bg0}'
set-window-option -g window-status-activity-style 'bg=#{@osaka_bg1},fg=#{@osaka_bg3}'
set-window-option -g window-status-current-style fg='#{@osaka_fg}',bg='#{@osaka_bg_green}'

# Panes
set-option -g pane-border-style fg='#{@osaka_bg1}'
set-option -g pane-active-border-style 'fg=#{@osaka_blue}'
set-option -g display-panes-active-colour '#4A90D9'
set-option -g display-panes-colour '#D9865F'

# Command messages
set-option -g message-style fg='#{@osaka_statusline3}',bg='#{@osaka_bg_dim}'
set-option -g message-command-style 'fg=#{@osaka_bg3},bg=#{@osaka_bg1}'

# Clock
set-window-option -g clock-mode-colour '#4A90D9'

# Bell
set-window-option -g window-status-bell-style fg='#{@osaka_bg0}',bg='#{@osaka_statusline3}'

# Formatting
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#{@osaka_bg_dim},bg=#{@osaka_green},bold] #S #[fg=#{@osaka_green},bg=#{@osaka_bg2},nobold]#[fg=#{@osaka_green},bg=#{@osaka_bg2},bold] #(whoami) #[fg=#{@osaka_bg2},bg=#{@osaka_bg0},nobold]'

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#{@osaka_bg2}]#[fg=#{@osaka_fg},bg=#{@osaka_bg2}] #[fg=#{@osaka_fg},bg=#{@osaka_bg2}]%Y-%m-%d  %H:%M #[fg=#{@osaka_aqua},bg=#{@osaka_bg2},bold]#[fg=#{@osaka_bg_dim},bg=#{@osaka_aqua},bold] #h '

set -g window-status-separator '#[fg=#{@osaka_grey2},bg=#{@osaka_bg0}] '
set -g window-status-format "#[fg=#{@osaka_grey0},bg=#{@osaka_bg0}] #I  #[fg=#{@osaka_grey0},bg=#{@osaka_bg0}]#W "
set -g window-status-current-format "#[fg=#{@osaka_bg0},bg=#{@osaka_bg_green}]#[fg=#{@osaka_fg},bg=#{@osaka_bg_green}] #I  #[fg=#{@osaka_fg},bg=#{@osaka_bg_green},bold]#W #[fg=#{@osaka_bg_green},bg=#{@osaka_bg0},nobold]"
