## COLORSCHEME: catppuccin mocha

# Backgrounds
set -g @catppuccin_bg_dim '#1E1E2E'
set -g @catppuccin_bg0 '#1A1826'
set -g @catppuccin_bg1 '#1E1E2E'
set -g @catppuccin_bg2 '#302D41'
set -g @catppuccin_bg3 '#575268'
set -g @catppuccin_bg4 '#6E6C7E'
set -g @catppuccin_bg_visual '#332E4D'
set -g @catppuccin_bg_red '#F38BA8'
set -g @catppuccin_bg_green '#ABE9B3'
set -g @catppuccin_bg_blue '#96CDFB'
set -g @catppuccin_bg_yellow '#FAE3B0'

# Foregrounds
set -g @catppuccin_fg '#D9E0EE'
set -g @catppuccin_red '#F38BA8'
set -g @catppuccin_orange '#FAB387'
set -g @catppuccin_yellow '#F9E2AF'
set -g @catppuccin_green '#ABE9B3'
set -g @catppuccin_aqua '#89DCEB'
set -g @catppuccin_blue '#96CDFB'
set -g @catppuccin_purple '#CBA6F7'
set -g @catppuccin_grey0 '#585B70'
set -g @catppuccin_grey1 '#6C7086'
set -g @catppuccin_grey2 '#9D7CD8'
set -g @catppuccin_statusline1 '#ABE9B3'
set -g @catppuccin_statusline2 '#D9E0EE'
set -g @catppuccin_statusline3 '#F38BA8'

# Status bar
set-option -g status "on"
set -g status-interval 2
set-option -g status-fg '#D9E0EE'
set-option -g status-bg '#1A1826'
set-option -g mode-style fg='#{@catppuccin_purple}',bg='#{@catppuccin_bg_red}'
set-option -g status-style fg='#{@catppuccin_fg}',bg='#{@catppuccin_bg_dim}',default

# Windows
set-window-option -g window-status-style fg='#{@catppuccin_bg4}',bg='#{@catppuccin_bg0}'
set-window-option -g window-status-activity-style 'bg=#{@catppuccin_bg1},fg=#{@catppuccin_bg3}'
set-window-option -g window-status-current-style fg='#{@catppuccin_fg}',bg='#{@catppuccin_bg_green}'

# Panes
set-option -g pane-border-style fg='#{@catppuccin_bg1}'
set-option -g pane-active-border-style 'fg=#{@catppuccin_blue}'
set-option -g display-panes-active-colour '#96CDFB'
set-option -g display-panes-colour '#FAB387'

# Command messages
set-option -g message-style fg='#{@catppuccin_statusline3}',bg='#{@catppuccin_bg_dim}'
set-option -g message-command-style 'fg=#{@catppuccin_bg3},bg=#{@catppuccin_bg1}'

# Clock
set-window-option -g clock-mode-colour '#96CDFB'

# Bell
set-window-option -g window-status-bell-style fg='#{@catppuccin_bg0}',bg='#{@catppuccin_statusline3}'

# Formatting
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#{@catppuccin_bg_dim},bg=#{@catppuccin_green},bold] #S #[fg=#{@catppuccin_green},bg=#{@catppuccin_bg2},nobold]#[fg=#{@catppuccin_green},bg=#{@catppuccin_bg2},bold] #(whoami) #[fg=#{@catppuccin_bg2},bg=#{@catppuccin_bg0},nobold]'

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#{@catppuccin_bg2}]#[fg=#{@catppuccin_fg},bg=#{@catppuccin_bg2}] #[fg=#{@catppuccin_fg},bg=#{@catppuccin_bg2}]%Y-%m-%d  %H:%M #[fg=#{@catppuccin_aqua},bg=#{@catppuccin_bg2},bold]#[fg=#{@catppuccin_bg_dim},bg=#{@catppuccin_aqua},bold] #h '

set -g window-status-separator '#[fg=#{@catppuccin_grey2},bg=#{@catppuccin_bg0}] '
set -g window-status-format "#[fg=#{@catppuccin_grey0},bg=#{@catppuccin_bg0}] #I  #[fg=#{@catppuccin_grey0},bg=#{@catppuccin_bg0}]#W "
set -g window-status-current-format "#[fg=#{@catppuccin_bg0},bg=#{@catppuccin_bg_green}]#[fg=#{@catppuccin_fg},bg=#{@catppuccin_bg_green}] #I  #[fg=#{@catppuccin_fg},bg=#{@catppuccin_bg_green},bold]#W #[fg=#{@catppuccin_bg_green},bg=#{@catppuccin_bg0},nobold]"

