# Herdr terminal workspace manager configuration
# Translated from tmux config (.tmux.conf)

# Disable first-run onboarding after initial setup.
onboarding = false

[theme]
# Single-palette approach (à la dmmulroy): one colorscheme (kanagawa) applied
# explicitly per tool. Base theme is herdr's built-in kanagawa; tokens below
# are exact kanagawa-wave hexes, mirroring nvim and the pi theme.
name = "kanagawa"
auto_switch = false

[theme.custom]
# Kanagawa wave palette overrides.
accent = "#957FB8"      # oniViolet
panel_bg = "#1F1F28"    # sumiInk3
surface0 = "#2A2A37"    # sumiInk4
surface1 = "#363646"    # sumiInk5
surface_dim = "#16161D" # sumiInk0
overlay0 = "#54546D"    # sumiInk6
overlay1 = "#727169"    # fujiGray
text = "#DCD7BA"        # fujiWhite
subtext0 = "#C8C093"    # oldWhite
mauve = "#957FB8"       # oniViolet
green = "#98BB6C"       # springGreen
yellow = "#E6C384"      # carpYellow
red = "#E46876"         # waveRed
blue = "#7E9CD8"        # crystalBlue
teal = "#7AA89F"        # waveAqua2
peach = "#FFA066"       # surimiOrange

[terminal]
default_shell = "fish"
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
# Prefix matches tmux: Ctrl+s instead of Ctrl+b.
prefix = "ctrl+s"

# Pane navigation: keep on prefix + h/j/k/l so Ctrl+h/l remain free for Vim.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Splits, matching tmux | (vertical/side-by-side) and - (horizontal/stacked).
split_vertical = "prefix+|"
split_horizontal = "prefix+-"

# Reload config (matches tmux prefix + r).
reload_config = "prefix+r"

# Resize mode moved to prefix + shift + r to avoid clashing with reload.
resize_mode = "prefix+shift+r"

# Zoom pane, matching tmux prefix + m.
zoom = "prefix+m"

# Tab management (tmux "windows").
new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"
rename_tab = "prefix+comma"

# Workspace management (tmux "sessions" / workspace picker).
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = ""
next_workspace = ""

# Agent navigation (switch between detected AI agents).
previous_agent = "prefix+["
next_agent = "prefix+]"
focus_agent = "prefix+alt+1..9"

# Pane operations.
close_pane = "prefix+x"
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+e"
copy_mode = "prefix+shift+["

# Misc.
detach = "prefix+d"
help = "prefix+?"
settings = "prefix+s"
goto = "prefix+g"
open_notification_target = "prefix+o"
toggle_sidebar = "prefix+b"

# Navigate-mode movement (used by resize mode and other navigation UI).
# Workspace picker uses arrow keys; h/j/k/l stay reserved for pane navigation.
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[ui]
mouse_capture = true
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
accent = "#957FB8"
confirm_close = true
prompt_new_tab_name = true

[ui.toast]
delivery = "off"

[session]
resume_agents_on_restore = true

[worktrees]
directory = "~/.herdr/worktrees"

[experimental]
pane_history = false
allow_nested = false
# Experimental local Kitty graphics rendering for attached clients.
# Requires a Kitty graphics-compatible outer terminal (Ghostty qualifies).
kitty_graphics = true

[remote]
manage_ssh_config = true

[advanced]
scrollback_limit_bytes = 10000000

[[keys.command]]
key = "prefix+shift+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+shift+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"
